apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo-prod
resources:
  - ../../base
images:
  - name: ghcr.io/abhichandra-v/gitops-demo-app
    newTag: v1.0.0
patches:
  - target:
      kind: Rollout
      name: demo-app
    patch: |
      - op: replace
        path: /spec/replicas
        value: 10

# Two projects with different blast radii.
#  - platform: cluster add-ons. May create cluster-scoped resources (CRDs,
#    ClusterRoles) but only from the pinned chart repositories and this repo,
#    and only into the platform namespaces.
#  - apps: workloads. Namespaced resources only, from this repo only, into the
#    demo namespaces only.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: Cluster add-ons managed from Git
  sourceRepos:
    - https://github.com/abhichandra-v/gitops-demo-app.git
    - https://argoproj.github.io/argo-helm
    - https://kubernetes.github.io/ingress-nginx
    - https://prometheus-community.github.io/helm-charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: argo-rollouts
    - server: https://kubernetes.default.svc
      namespace: ingress-nginx
    - server: https://kubernetes.default.svc
      namespace: monitoring
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: Application workloads released through Argo Rollouts
  sourceRepos:
    - https://github.com/abhichandra-v/gitops-demo-app.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: demo-dev
    - server: https://kubernetes.default.svc
      namespace: demo-prod
  # Only Namespace may be created at cluster scope (CreateNamespace=true).
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace

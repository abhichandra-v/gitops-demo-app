# Constant background traffic through the ingress, so Prometheus always has
# requests to analyse and the canary receives its weighted share.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  annotations:
    # `fortio load` is a client with no listening port and the image has no
    # shell, so there is nothing for a probe to call.
    kube-score/ignore: pod-probes
    checkov.io/skip1: CKV_K8S_8=fortio load exposes no endpoint to probe
    checkov.io/skip2: CKV_K8S_9=fortio load exposes no endpoint to probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loadgen
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loadgen
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fortio
          image: fortio/fortio:1.76.0
          args:
            - load
            - -qps=20
            - -c=4
            - -t=0
            - -quiet
            - -allow-initial-errors
            - "-H=Host: demo.localtest.me"
            - http://ingress-nginx-controller.ingress-nginx.svc.cluster.local/
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
              ephemeral-storage: 16Mi
            limits:
              cpu: 200m
              memory: 128Mi
              ephemeral-storage: 64Mi

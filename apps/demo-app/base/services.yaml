# Argo Rollouts rewrites the selector of each Service to add the
# rollouts-pod-template-hash of the stable or canary ReplicaSet.
apiVersion: v1
kind: Service
metadata:
  name: demo-app-stable
spec:
  selector:
    app.kubernetes.io/name: demo-app
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app-canary
spec:
  selector:
    app.kubernetes.io/name: demo-app
  ports:
    - name: http
      port: 80
      targetPort: http

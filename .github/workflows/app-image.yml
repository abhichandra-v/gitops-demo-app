name: app-image

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/app-image.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/abhichandra-v/gitops-demo-app
  GO_VERSION: "1.27.2"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: app/go.sum
      - name: Vet and test
        working-directory: app
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -count=1 ./...

  build:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with app/releases.env.
        include:
          - tag: v1.0.0
            color: blue
            fault_mode: ""
          - tag: v2.0.0
            color: green
            fault_mode: ""
          - tag: v3.0.0-bad
            color: red
            fault_mode: error-40pct
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: app
          push: true
          tags: ${{ env.IMAGE }}:${{ matrix.tag }}
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
            VERSION=${{ matrix.tag }}
            COLOR=${{ matrix.color }}
            FAULT_MODE=${{ matrix.fault_mode }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}
